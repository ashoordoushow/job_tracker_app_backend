default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: job_tracker_app_backend_development

test:
  <<: *default
  database: job_tracker_app_backend_test

production:
  primary: &primary_production
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *primary_production
  queue:
    <<: *primary_production
  cache:
    <<: *primary_production